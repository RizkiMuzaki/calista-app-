# Nixpacks configuration to automate Laravel permissions on deploy and start
[phases.build]
cmds = [
    "...",
    "chmod -R 777 storage bootstrap/cache"
]

[start]
cmd = "mkdir -p /app/public/download/audio_packs /app/public/download/tts-cache && chmod -R 777 /app/public/download && mkdir -p storage/app/livewire-tmp storage/app/private/livewire-tmp storage/app/public && rm -rf storage/app/public/audio_packs storage/app/private/tts-cache && ln -sf /app/public/download/audio_packs storage/app/public/audio_packs && ln -sf /app/public/download/tts-cache storage/app/private/tts-cache && chmod -R 777 storage bootstrap/cache && php artisan storage:link --force && php artisan migrate --force && php artisan queue:work --daemon --tries=3 & php-fpm -y /assets/php-fpm.conf & nginx -c /app/nginx.conf"
